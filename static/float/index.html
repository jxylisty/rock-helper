<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>实时伤害</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent !important;
    background-color: transparent !important;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #2C3A2F;
    font-size: 11.5px;
    user-select: none;
    background: transparent !important;
    background-color: transparent !important;
  }
  .mono { font-family: Monaco, Consolas, "Courier New", monospace; font-variant-numeric: tabular-nums; }

  /* ---------- 悬浮球（40dp 紧凑尺寸；若存在 ball.png 贴图则优先显示贴图） ---------- */
  #ball {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 24%, rgba(255, 255, 255, .5) 0, rgba(255, 255, 255, 0) 36%),
      linear-gradient(150deg, #34d399 0%, #16a34a 55%, #0b7a3c 100%);
    border: 2px solid rgba(255, 255, 255, .65);
    box-shadow: 0 4px 10px rgba(6, 46, 24, .45), inset 0 -4px 8px rgba(0, 0, 0, .20);
    color: #fff;
    cursor: pointer;
    touch-action: none;
  }
  .ball-img { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
  .ball-inner { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .ball-icon { font-size: 14px; text-shadow: 0 1.5px 2px rgba(0, 0, 0, .35); }
  .ball-text { font-size: 7.5px; font-weight: 800; letter-spacing: .12em; margin-top: 1px; opacity: .95; }
  #panel { display: none; }

  /* ---------- 贴图模式（ball.png 加载成功）：隐藏 CSS 球，纯透贴图，严禁 filter/box-shadow ---------- */
  #ball.has-img {
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
    filter: none !important;
  }
  #ball.has-img .ball-inner { display: none; }
  #ball.has-img .ball-img {
    filter: none !important;
    animation: ballPulse 3.4s ease-in-out infinite;
  }
  @keyframes ballPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  /* ---------- uts-ball 状态下严格纯透明背景，严禁任何可能产生灰边框的滤镜与投影 ---------- */
  body.uts-ball, html.uts-ball {
    background: transparent !important;
    background-color: transparent !important;
  }
  body.uts-ball #panel {
    display: none !important;
  }
  body.uts-ball #ball {
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
    filter: none !important;
  }
  body.uts-ball .ball-img {
    filter: none !important;
  }
  body.uts-ball #ball:not(.has-img) {
    border-radius: 50%;
    background: linear-gradient(150deg, #34d399 0%, #16a34a 55%, #0b7a3c 100%) !important;
    border: 2px solid rgba(255, 255, 255, .65) !important;
  }

  /* ---------- 交互特效（inapp 模式由 JS 加 class） ---------- */
  #ball.pressed { transform: scale(.92); }
  #ball.pressed .ball-img { animation-play-state: paused; }
  #ball.dragging { transform: scale(1.10); }
  #ball.bounce { animation: ballBounce .38s ease; }

  /* ---------- 面板（展开态：洛克羊皮纸轻复古金风格，对齐应用整体UI） ---------- */
  body.expanded #ball, body.uts-panel #ball { display: none !important; }
  body.expanded #panel {
    display: flex; flex-direction: column;
    position: fixed; inset: 0;
    background: #FAF6EC;
    background-image:
      radial-gradient(circle at 12% 6%, rgba(198, 75, 56, 0.05) 0, transparent 42%),
      radial-gradient(circle at 88% 22%, rgba(201, 161, 78, 0.06) 0, transparent 40%);
    border: 1.5px solid #D9B96A;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(44, 58, 47, 0.18);
    padding: 5px 6px;
    gap: 4px;
    overflow-y: auto;
  }
  body.uts-panel #panel {
    display: flex; flex-direction: column;
    position: fixed; inset: 0;
    background: #FAF6EC !important;
    background-image:
      radial-gradient(circle at 12% 6%, rgba(198, 75, 56, 0.05) 0, transparent 42%),
      radial-gradient(circle at 88% 22%, rgba(201, 161, 78, 0.06) 0, transparent 40%) !important;
    border: 1.5px solid #D9B96A !important;
    box-shadow: 0 4px 18px rgba(44, 58, 47, 0.22) !important;
    border-radius: 12px !important;
    padding: 3px 6px 5px;
    gap: 4px;
    overflow-y: auto;
  }

  body.uts-panel .head-btn { display: none; }
  body.uts-panel .head-sub { display: none; }
  .head-hint { display: none; }

  .head { display: flex; align-items: center; gap: 4px; flex-shrink: 0; padding: 1px 2px; }
  .head-title { font-size: 11.5px; font-weight: 800; color: #2C3A2F; flex: 1; letter-spacing: 0.02em; }
  .head-btn {
    padding: 2px 7px; border-radius: 999px; font-size: 9px; font-weight: 700;
    background: #F7F1E3; border: 1px solid #E3DCC8; color: #6B7A6E; cursor: pointer;
  }
  .head-btn:active { background: #E3DCC8; }
  .head-btn.accent {
    background: linear-gradient(135deg, #1E7A46, #2F9E5F);
    border-color: #166235; color: #FFF9EC;
    box-shadow: 0 1.5px 4px rgba(30, 122, 70, 0.25);
  }

  .card {
    background: #FFFDF7;
    border: 1.5px solid #E3DCC8;
    border-radius: 9px;
    box-shadow: 0 2px 0 rgba(44, 58, 47, 0.06);
    flex-shrink: 0;
  }

  /* ---------- 结果卡（对齐伤害计算页） ---------- */
  .result-card {
    padding: 5px 7px;
    background: #FFFDF7;
    border: 1.5px solid #D9B96A;
    box-shadow: 0 2px 0 rgba(169, 127, 53, 0.15);
  }
  .result-skill-row { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
  .result-skill-name { font-size: 11.5px; font-weight: 800; color: #2C3A2F; }
  .chip {
    padding: 1px 5px; border-radius: 4px; font-size: 8px; font-weight: 700;
    background: #F7F1E3; border: 1px solid #E3DCC8; color: #6B7A6E;
  }
  .chip.type { color: #fff; font-weight: 800; border: none; }
  .chip.gold { color: #A97F35; background: #FFF6DE; border: 0.5px solid #C9A14E; }
  .chip.adv { color: #C64B38; background: #FBE9E4; border: 0.5px solid #E8A99E; }
  .chip.disadv { color: #2C6FD1; background: #EDF3FC; border: 0.5px solid #C4D8F2; }
  .chip.stab { color: #1E7A46; background: #EFF7EF; border: 0.5px solid #BFDCC6; }
  .dmg-track {
    position: relative; height: 6px; background: #E3DCC8; border-radius: 999px;
    overflow: hidden; margin-top: 4px; border: 1px solid #D5CEBA;
  }
  .dmg-fill {
    position: absolute; top: 0; left: 0; height: 100%;
    background: linear-gradient(90deg, #E0604E, #C64B38);
    border-radius: 999px; transition: width .2s;
  }
  .dmg-nums { display: flex; align-items: baseline; gap: 3px; margin-top: 3px; }
  .result-damage { font-size: 14px; font-weight: 900; color: #1E7A46; }
  .result-damage.kill { color: #C64B38; }
  .result-hp { font-size: 9px; color: #8A988D; font-weight: 700; }
  .result-pct { margin-left: auto; font-size: 11px; font-weight: 800; color: #6B7A6E; }
  .verdict {
    margin-left: 3px; padding: 1px 5px; border-radius: 3px;
    font-size: 8px; font-weight: 800;
    background: #EFF7EF; color: #1E7A46; border: 1px solid #BFDCC6;
  }
  .verdict.kill {
    background: #FBE9E4; color: #C64B38; border-color: #E8A99E;
  }
  .result-note { margin-top: 3px; font-size: 8px; color: #8A988D; line-height: 1.35; font-weight: 700; }
  .empty-tip { text-align: center; color: #8A988D; padding: 10px 0; font-size: 10px; font-weight: 700; }
  .error-tip { text-align: center; color: #C64B38; padding: 10px 6px; font-size: 10px; line-height: 1.5; font-weight: 700; }

  /* ---------- 精灵行卡片（对方 / 我方） ---------- */
  .side-card { padding: 4px 6px 5px; }
  .side-row { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .side-label {
    flex-shrink: 0; font-size: 8px; font-weight: 800; color: #FFF9EC;
    padding: 1px 5px; border-radius: 999px;
  }
  .side-label.opp { background: linear-gradient(135deg, #C64B38, #E0604E); box-shadow: 0 1px 3px rgba(198, 75, 56, 0.25); }
  .side-label.mine { background: linear-gradient(135deg, #2C6FD1, #4F9CFF); box-shadow: 0 1px 3px rgba(44, 111, 209, 0.25); }
  .side-avatar-wrap {
    width: 22px; height: 22px; border-radius: 5px;
    background: #F7F1E3; border: 1px solid #E3DCC8;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
  }
  .side-avatar { width: 100%; height: 100%; object-fit: contain; }
  .side-info { flex: 1; min-width: 0; }
  .side-name-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .side-name { font-size: 11px; font-weight: 800; color: #2C3A2F; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type-badges { display: inline-flex; gap: 2px; }
  .type-badge {
    width: 17px; height: 12px; border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 7.5px; font-weight: 700; color: #fff;
    border: 1px solid rgba(255, 255, 255, .3); overflow: hidden;
  }
  .type-badge img { width: 10px; height: 10px; object-fit: contain; }

  .sc-icon {
    width: 11px; height: 11px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 6.5px; font-weight: 700; color: #fff;
    border: 1px solid rgba(255, 255, 255, .4); flex-shrink: 0;
  }
  .sc-icon img { width: 9px; height: 9px; object-fit: contain; }
  .blood-tag {
    font-style: normal; font-size: 7.5px; font-weight: 800; color: #A97F35;
    background: #FFF6DE; border: 1px solid #C9A14E; border-radius: 3px;
    padding: 0 2px; line-height: 1.2; flex-shrink: 0;
  }

  /* 对方配置（满配/自定） */
  .cfg-row { display: flex; align-items: center; gap: 3px; margin-top: 4px; }
  .cfg-toggle {
    height: 16px; padding: 0 6px; border-radius: 999px;
    display: inline-flex; align-items: center;
    font-size: 8.5px; font-weight: 700; color: #6B7A6E;
    background: #F7F1E3; border: 1px solid #E3DCC8; cursor: pointer;
  }
  .cfg-toggle.active {
    background: linear-gradient(135deg, #1E7A46, #2F9E5F); border-color: #166235; color: #FFF9EC;
    box-shadow: 0 1px 3px rgba(30, 122, 70, 0.2);
  }
  .cfg-hint { flex: 1; min-width: 0; font-size: 8px; color: #8A988D; font-weight: 700; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cfg-edit { display: none; margin-top: 4px; }
  .cfg-edit.open { display: block; }
  .cfg-line { display: flex; align-items: center; gap: 4px; }
  .iv-toggles { display: flex; gap: 3px; margin-top: 4px; }
  .iv-toggle {
    flex: 1; height: 21px; border-radius: 5px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #F7F1E3; border: 1px solid #E3DCC8; cursor: pointer;
  }
  .iv-toggle.on { background: #EFF7EF; border-color: #BFDCC6; }
  .iv-toggle .iv-label { font-size: 7.5px; font-weight: 700; color: #6B7A6E; line-height: 1.1; }
  .iv-toggle .iv-value { font-size: 8px; font-weight: 800; color: #A3AE9F; line-height: 1.1; }
  .iv-toggle.on .iv-value { color: #1E7A46; font-weight: 800; }

  /* 互换攻守 */
  .swap-row { display: flex; justify-content: center; flex-shrink: 0; margin: -2px 0; }
  .swap-btn {
    padding: 1.5px 8px; border-radius: 999px;
    font-size: 8.5px; font-weight: 800; color: #A97F35;
    background: #FFFDF7; border: 1.5px solid #E3DCC8; box-shadow: 0 1px 0 rgba(44, 58, 47, 0.06); cursor: pointer;
  }
  .swap-btn:active { background: #FFF6DE; border-color: #C9A14E; }
  .side-action {
    flex-shrink: 0; padding: 1.5px 7px; border-radius: 999px;
    font-size: 8.5px; font-weight: 800; color: #6B7A6E;
    background: #F7F1E3; border: 1px solid #E3DCC8; cursor: pointer;
  }
  .side-action:active { background: #FFF6DE; border-color: #C9A14E; color: #A97F35; }

  /* 技能 chips 横滑与分组（对齐伤害计算页） */
  .skill-strip {
    display: flex; gap: 7px; overflow-x: auto; margin-top: 4px; padding-bottom: 2px;
    align-items: flex-start;
  }
  .skill-strip::-webkit-scrollbar { display: none; }
  .ss-group {
    display: inline-flex; flex-direction: column; gap: 2.5px; flex-shrink: 0;
  }
  .ss-group-label {
    font-size: 7.5px; font-weight: 800; color: #8A988D; letter-spacing: 0.03em;
    padding-left: 2px; line-height: 1.1;
  }
  .ss-group-label.gold { color: #A97F35; }
  .ss-chip-row {
    display: flex; gap: 3px; align-items: center;
  }
  .skill-chip {
    flex-shrink: 0; height: 19px; padding: 0 5.5px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 2.5px;
    font-size: 8.5px; font-weight: 700; color: #2C3A2F;
    background: #F7F1E3; border: 1.5px solid #E3DCC8; cursor: pointer; white-space: nowrap;
    transition: all 0.12s ease;
  }
  .skill-chip.active {
    background: #FFF6DE; border-color: #C9A14E; color: #2C3A2F;
    box-shadow: 0 1.5px 0 rgba(169, 127, 53, 0.25);
  }
  .skill-chip .sc-name {
    max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800;
  }
  .skill-chip .power { font-weight: 800; opacity: .95; color: #A97F35; }
  .skill-chip.active .power { color: #A97F35; font-weight: 900; }
  .adv-tag {
    font-style: normal; font-size: 7px; font-weight: 800; color: #C64B38;
    background: #FBE9E4; border: 0.5px solid #E8A99E; border-radius: 2px;
    padding: 0 1.5px; line-height: 1.1; flex-shrink: 0;
  }
  .disadv-tag {
    font-style: normal; font-size: 7px; font-weight: 800; color: #2C6FD1;
    background: #EDF3FC; border: 0.5px solid #C4D8F2; border-radius: 2px;
    padding: 0 1.5px; line-height: 1.1; flex-shrink: 0;
  }

  /* 我方性格与下拉 */
  .nature-row { display: flex; align-items: center; gap: 3px; margin-top: 4px; }
  .nature-label { font-size: 8.5px; font-weight: 700; color: #6B7A6E; }
  .dd-box {
    flex: 1; min-width: 0; height: 19px; padding: 0 5px; border-radius: 6px;
    border: 1.5px solid #E3DCC8; background: #F7F1E3; color: #2C3A2F;
    font-size: 8.5px; font-weight: 800; line-height: 17px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: pointer; position: relative;
    display: inline-flex; align-items: center; justify-content: space-between;
  }
  .dd-box.active { border-color: #C9A14E; background: #FFF6DE; }
  .dd-box::after {
    content: '▾'; position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    font-size: 7px; color: #8A988D; pointer-events: none;
  }
  .dd-val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 悬浮窗内专属性格选择浮层 */
  .nature-popover {
    display: none;
    position: absolute;
    left: 5px; right: 5px; bottom: 5px;
    background: #FFFDF7;
    border: 1.5px solid #D9B96A;
    border-radius: 10px;
    box-shadow: 0 4px 18px rgba(44, 58, 47, 0.22);
    padding: 5px 6px;
    z-index: 80;
  }
  .nature-popover.open { display: block; animation: popoverUp 0.16s ease-out; }
  @keyframes popoverUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .nature-popover-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px; padding: 0 2px;
  }
  .nature-popover-title {
    font-size: 9.5px; font-weight: 800; color: #A97F35;
  }
  .nature-popover-close {
    font-size: 11px; font-weight: 800; color: #8A988D; cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .nature-popover-close:active { color: #2C3A2F; }
  .nature-popover-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
  }
  .nature-chip {
    height: 22px; border-radius: 5px;
    background: #F7F1E3; border: 1px solid #E3DCC8;
    color: #2C3A2F; font-size: 9.5px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .nature-chip:active { transform: scale(0.95); }
  .nature-chip.active {
    background: linear-gradient(135deg, #1E7A46, #2F9E5F);
    border-color: #166235; color: #FFF9EC;
    box-shadow: 0 1px 3px rgba(30, 122, 70, 0.25);
  }

  /* 内联展开的选精灵列表 */
  .inline-picker { display: none; margin-top: 5px; }
  .inline-picker.open { display: block; }
  .search-input {
    width: 100%; height: 23px; padding: 0 7px; border-radius: 7px;
    border: 1.5px solid #E3DCC8; background: #F7F1E3;
    color: #2C3A2F; font-size: 10px; font-weight: 700; outline: none; box-sizing: border-box;
  }
  .search-input::placeholder { color: #A3AE9F; }
  .pick-list { margin-top: 4px; max-height: 100px; overflow-y: auto; display: flex; flex-direction: column; gap: 2.5px; }
  .pick-item {
    display: flex; align-items: center; gap: 4px;
    height: 22px; padding: 0 5px; border-radius: 6px;
    background: #F7F1E3; border: 1px solid #E3DCC8; cursor: pointer;
  }
  .pick-item.active { background: #FFF6DE; border-color: #C9A14E; box-shadow: 0 1px 0 rgba(169, 127, 53, 0.2); }
  .pick-avatar-wrap {
    width: 17px; height: 17px; border-radius: 4px;
    background: #FFFDF7; border: 1px solid #E3DCC8;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
  }
  .pick-avatar { width: 100%; height: 100%; object-fit: contain; }
  .pick-name { flex: 1; font-size: 10px; font-weight: 800; color: #2C3A2F; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick-speed { font-size: 8px; color: #2C6FD1; font-weight: 800; }
  .leader-badge {
    display: inline-block; margin-left: 2px; padding: 0 2px; border-radius: 2px;
    font-size: 7px; font-weight: 800; color: #C64B38; background: #FBE9E4;
    border: 0.5px solid #E8A99E; vertical-align: middle; line-height: 1.1;
  }
</style>
</head>
<body>
  <div id="ball"><img class="ball-img" src="ball.png" onerror="this.remove()" onload="this.parentNode.classList.add('has-img')" alt="" /><div class="ball-inner"><div class="ball-icon">⚔</div><div class="ball-text">伤害</div></div></div>
  <div id="panel">
    <div class="head">
      <div class="head-title">⚔ 实时对战伤害</div>
      <div class="head-btn accent" id="btn-collapse">收起</div>
      <div class="head-btn" id="btn-close">✕</div>
    </div>

    <div class="card result-card" id="result"></div>

    <div class="card side-card" id="opp-card">
      <div class="side-row" id="opp-row">
        <span class="side-label opp">对方</span>
        <div class="side-avatar-wrap">
          <img class="side-avatar" id="opp-avatar" onerror="this.style.display='none'" alt="" />
        </div>
        <div class="side-info">
          <div class="side-name-row"><span class="side-name" id="opp-name">未选择</span></div>
          <div class="type-badges" id="opp-types"></div>
        </div>
        <div class="side-action" id="btn-opp-change">换</div>
      </div>
      <div class="skill-strip" id="opp-skills"></div>
      <div class="cfg-row">
        <span class="cfg-toggle" id="opp-cfg-auto">满配</span>
        <span class="cfg-toggle" id="opp-cfg-custom">自定</span>
        <span class="cfg-hint" id="opp-cfg-hint"></span>
      </div>
      <div class="cfg-edit" id="opp-cfg-edit">
        <div class="cfg-line">
          <span class="nature-label">性格</span>
          <span class="dd-box" id="opp-nature-up"><span class="dd-val"></span></span>
          <span class="dd-box" id="opp-nature-down"><span class="dd-val"></span></span>
        </div>
        <div class="iv-toggles" id="opp-iv-toggles"></div>
      </div>
      <div class="inline-picker" id="opp-picker">
        <input class="search-input" id="opp-search" placeholder="搜索对方精灵" />
        <div class="pick-list" id="opp-list"></div>
      </div>
    </div>

    <div class="swap-row">
      <span class="swap-btn" id="btn-swap">⇅ 攻守互换</span>
    </div>

    <div class="card side-card" id="my-card">
      <div class="side-row" id="my-row">
        <span class="side-label mine">我方</span>
        <div class="side-avatar-wrap">
          <img class="side-avatar" id="my-avatar" onerror="this.style.display='none'" alt="" />
        </div>
        <div class="side-info">
          <div class="side-name-row"><span class="side-name" id="my-name">未选择</span></div>
          <div class="type-badges" id="my-types"></div>
        </div>
        <div class="side-action" id="btn-my-change">换</div>
      </div>
      <div class="nature-row">
        <span class="nature-label">性格</span>
        <span class="dd-box" id="my-nature-up"><span class="dd-val"></span></span>
        <span class="dd-box" id="my-nature-down"><span class="dd-val"></span></span>
      </div>
      <div class="inline-picker" id="my-picker">
        <input class="search-input" id="my-search" placeholder="搜索我方精灵" />
        <div class="pick-list" id="my-list"></div>
      </div>
    </div>

    <!-- 悬浮窗内专属性格选择浮层（纯小窗内部渲染，绝不触发手机系统弹窗） -->
    <div class="nature-popover" id="nature-popover">
      <div class="nature-popover-head">
        <span class="nature-popover-title" id="nature-popover-title">选择性格</span>
        <span class="nature-popover-close" id="nature-popover-close">✕</span>
      </div>
      <div class="nature-popover-grid" id="nature-popover-grid"></div>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
