<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>实时伤害</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: transparent;
    color: #e6edf3;
    font-size: 13px;
    user-select: none;
  }

  /* ---------- 收起态：悬浮球 ---------- */
  #ball {
    position: fixed; right: 6px; bottom: 6px;
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #16a34a, #0ea5e9);
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 600;
    cursor: pointer;
  }

  /* ---------- 展开态：面板 ---------- */
  #panel {
    position: fixed; inset: 0;
    background: #16213e;
    display: none; flex-direction: column;
    padding: 8px 10px 10px;
  }
  body.expanded #panel { display: flex; }
  body.expanded #ball { display: none; }

  /* ---------- 小球独立窗口模式（Native.js 双窗口） ---------- */
  body.ball-mode { background: transparent; }
  body.ball-mode #panel { display: none !important; }
  body.ball-mode #ball {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border-radius: 0;
    box-shadow: none;
    font-size: 13px;
  }
  body.ball-mode.expanded #ball { display: flex; }

  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .head-title { font-size: 14px; font-weight: 700; color: #fff; flex: 1; }
  .head-btn {
    padding: 3px 10px; border-radius: 10px; font-size: 12px;
    background: rgba(255,255,255,.12); color: #cbd5e1; cursor: pointer;
  }
  .head-btn.accent { background: #16a34a; color: #fff; }

  .tabs { display: flex; gap: 6px; margin-bottom: 6px; }
  .tab {
    flex: 1; text-align: center; padding: 5px 0; border-radius: 8px;
    background: rgba(255,255,255,.08); color: #94a3b8; font-size: 12px; cursor: pointer;
  }
  .tab.active { background: #16a34a; color: #fff; font-weight: 600; }

  .search-input {
    width: 100%; padding: 6px 10px; border-radius: 8px; border: none;
    background: rgba(255,255,255,.1); color: #e6edf3; font-size: 13px; outline: none;
    margin-bottom: 6px;
  }
  .search-input::placeholder { color: #64748b; }

  .pet-list { flex: 1; overflow-y: auto; min-height: 0; }
  .pet-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px; border-radius: 8px; margin-bottom: 3px;
    background: rgba(255,255,255,.05); cursor: pointer;
  }
  .pet-item.active { background: rgba(34,197,94,.25); outline: 1px solid #22c55e; }
  .pet-name { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pet-types { font-size: 11px; color: #94a3b8; }
  .pet-speed { font-size: 11px; color: #64748b; }

  .skill-strip {
    display: flex; gap: 5px; overflow-x: auto; padding: 4px 0;
    border-top: 1px solid rgba(255,255,255,.08); border-bottom: 1px solid rgba(255,255,255,.08);
    margin-bottom: 6px; flex-shrink: 0;
  }
  .skill-chip {
    flex-shrink: 0; padding: 4px 9px; border-radius: 8px; font-size: 12px;
    background: rgba(255,255,255,.08); color: #cbd5e1; cursor: pointer; white-space: nowrap;
  }
  .skill-chip.active { background: #0ea5e9; color: #fff; }

  .result {
    background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.35);
    border-radius: 10px; padding: 8px 10px; flex-shrink: 0;
  }
  .result-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .result-skill-name { font-size: 12px; color: #94a3b8; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-damage { font-size: 22px; font-weight: 700; color: #22c55e; font-variant-numeric: tabular-nums; }
  .result-damage.kill { color: #ef4444; }
  .result-rows { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: #cbd5e1; }
  .result-row b { color: #fff; font-weight: 600; }
  .result-note { margin-top: 4px; font-size: 10px; color: #64748b; }

  .empty-tip { text-align: center; color: #64748b; padding: 20px 0; font-size: 12px; }
  .error-tip { text-align: center; color: #ef4444; padding: 20px 12px; font-size: 12px; line-height: 1.6; }

  .nature-row { display: flex; gap: 4px; align-items: center; margin-bottom: 6px; flex-shrink: 0; }
  .nature-label { font-size: 11px; color: #94a3b8; }
  .nature-select {
    flex: 1; padding: 4px 6px; border-radius: 8px; border: none;
    background: rgba(255,255,255,.1); color: #e6edf3; font-size: 12px; outline: none;
  }
  .nature-select option { background: #16213e; color: #e6edf3; }
</style>
</head>
<body>
  <div id="ball">伤害</div>
  <div id="panel">
    <div class="head">
      <div class="head-title">实时伤害（对方满配）</div>
      <div class="head-btn" id="btn-collapse">收起</div>
    </div>
    <div class="tabs">
      <div class="tab" id="tab-opponent">对方精灵</div>
      <div class="tab" id="tab-mine">我方精灵</div>
    </div>
    <div id="tab-content"></div>
    <div class="result" id="result"></div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
